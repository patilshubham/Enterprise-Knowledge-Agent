# SPA static hosting for the Enterprise Knowledge Agent frontend.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # TASK-MDR-02: baseline security headers + CSP. The build is fully
    # self-hosted (no third-party script/font/CDN origins - Monaco is bundled
    # from the npm package, fonts are self-hosted via @fontsource-variable),
    # so the policy can be strict: only 'self' plus what the SPA actually
    # needs (inline styles for React/Radix/react-resizable-panels' inline
    # `style` attributes, blob: workers for Monaco's web worker fallback).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; frame-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # Same-origin reverse proxy to the API (TASK-FND-06): keeps the SPA and
    # API on one origin in compose. `api` resolves via Docker DNS on
    # eka-network.
    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_path / /;
        # The API sets the same security headers itself (TASK-MDR-02) - hide its
        # copies so the client only sees nginx's single, edge-authoritative set.
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Content-Security-Policy;
    }

    # SignalR hubs need the WebSocket upgrade headers forwarded explicitly.
    location /hubs/ {
        proxy_pass http://api:8080/hubs/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_path / /;
        proxy_read_timeout 3600s;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Content-Security-Policy;
    }

    # TASK-UX-04: header health indicator polls the API's readiness probe
    # same-origin, same reasoning as /api above.
    location /health/ {
        proxy_pass http://api:8080/health/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Content-Security-Policy;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-lived caching for content-hashed build assets.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
}
